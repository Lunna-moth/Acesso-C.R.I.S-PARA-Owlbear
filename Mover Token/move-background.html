<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Move Background</title>
</head>
<body>
  <script type="module">
    import OBR from 'https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm';

    const CHANNEL = 'com.example.move-token/start';

    function linear(t) { return t; }
    function easeInQuad(t) { return t * t; }
    function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }
    function easeInOutQuad(t) {
      return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    const EASING_FNS = {
      linear,
      easeInQuad,
      easeOutQuad,
      easeInOutQuad
    };

    OBR.onReady(async () => {
      if (!OBR.isAvailable) return;

      OBR.broadcast.onMessage(CHANNEL, async (event) => {
        const { tokenId, endX, endY, duration, easing } = event.data || {};
        if (!tokenId || typeof endX !== 'number' || typeof endY !== 'number') return;

        const items = await OBR.scene.items.getItems([tokenId]);
        if (items.length === 0) return;

        const startX = items[0].position.x;
        const startY = items[0].position.y;
        const easeFn = EASING_FNS[easing] || easeInOutQuad;

        if (startX === endX && startY === endY) return;

        const startTime = performance.now();
        const MIN_INTERVAL = 33; // ~30fps (bom equilíbrio entre suavidade e sync)
        let lastUpdate = 0;
        let busy = false;

        function frame() {
          const now = performance.now();
          const elapsed = now - startTime;
          const t = Math.min(1, elapsed / duration);
          const eased = easeFn(t);
          const x = startX + (endX - startX) * eased;
          const y = startY + (endY - startY) * eased;

          if (!busy && (now - lastUpdate >= MIN_INTERVAL || t >= 1)) {
            lastUpdate = now;
            busy = true;
            OBR.scene.items.updateItems([tokenId], (items) => {
              for (const item of items) {
                item.position.x = x;
                item.position.y = y;
              }
            }).finally(() => { busy = false; });
          }

          if (t < 1) {
            requestAnimationFrame(frame);
          } else {
            // Garante posição final exata
            OBR.scene.items.updateItems([tokenId], (items) => {
              for (const item of items) {
                item.position.x = endX;
                item.position.y = endY;
              }
            });
          }
        }

        requestAnimationFrame(frame);
      });
    });
  </script>
</body>
</html>
