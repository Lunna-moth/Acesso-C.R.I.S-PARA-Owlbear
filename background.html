<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Background</title>
</head>
<body>
  <script type="module">
    import OBR from 'https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm';

    const KEY_NORMAL = 'com.example.image-link/imageUrl';
    const KEY_UV = 'com.example.image-link/uvImageUrl';
    const MODAL_ID = 'com.example.image-link/modal';

    OBR.onReady(async () => {
      if (!OBR.isAvailable) return;

      let armedTokenId = null;

      OBR.player.onChange(async (player) => {
        if (!player.selection || player.selection.length !== 1) return;

        const itemId = player.selection[0];

        if (itemId === armedTokenId) {
          armedTokenId = null;

          const items = await OBR.scene.items.getItems([itemId]);
          if (items.length === 0) return;

          const item = items[0];
          const normalUrl = item.metadata[KEY_NORMAL] || '';
          const uvUrl = item.metadata[KEY_UV] || '';

          // Só abre o modal se houver pelo menos uma das imagens
          if (!normalUrl && !uvUrl) return;

          const params = new URLSearchParams();
          if (normalUrl) params.set('url', normalUrl);
          if (uvUrl) params.set('uvUrl', uvUrl);

          OBR.modal.open({
            id: MODAL_ID,
            url: `/modal.html?${params.toString()}`,
            width: 780,
            height: 520,
            fullScreen: false,
            hideBackdrop: false
          });
        } else {
          armedTokenId = itemId;
        }
      });
    });
  </script>
</body>
</html>
