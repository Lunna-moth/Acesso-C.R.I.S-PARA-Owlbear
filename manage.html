<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciar Vínculos de Imagens</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 12px;
      background: var(--obr-background, #1e1e2e);
      color: var(--obr-text, #cdd6f4);
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-sizing: border-box;
      margin: 0;
    }
    h3 { margin: 0; font-size: 15px; }
    .hint {
      font-size: 11px;
      color: #a6adc8;
      background: #313244;
      padding: 8px;
      border-radius: 6px;
      border-left: 3px solid #89b4fa;
      line-height: 1.5;
    }
    .hint b { color: #cdd6f4; }
    .token-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 480px;
      overflow-y: auto;
    }
    .token-item {
      background: #313244;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #45475a;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .token-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .token-name {
      font-weight: 600;
      font-size: 14px;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badges { font-size: 12px; white-space: nowrap; }
    .slot {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #1e1e2e;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #45475a;
    }
    .slot.uv { border-color: #6c3fc7; }
    .slot-label {
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.3px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .slot.uv .slot-label { color: #c4a7ff; }
    .slot.normal .slot-label { color: #89b4fa; }
    .slot-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .slot-actions > * { flex-shrink: 0; }
    .slot-actions select,
    .slot-actions input { flex: 1; min-width: 0; }
    select, button, input[type="text"] {
      padding: 5px 8px;
      border-radius: 6px;
      border: 1px solid #45475a;
      background: #1e1e2e;
      color: #cdd6f4;
      font-size: 12px;
      font-family: inherit;
      box-sizing: border-box;
    }
    input[type="text"] { width: 100%; }
    input[type="text"]::placeholder { color: #6c7086; }
    select { width: 100%; cursor: pointer; }
    button { cursor: pointer; font-weight: bold; }
    button.link {
      background: #89b4fa;
      color: #1e1e2e;
      border: none;
      padding: 5px 8px;
      font-size: 11px;
    }
    button.link:hover { background: #74c7ec; }
    button.link.uv {
      background: #c4a7ff;
      color: #1e1e2e;
    }
    button.link.uv:hover { background: #a686e8; }
    button.remove {
      background: #f38ba8;
      color: white;
      border: none;
      padding: 5px 8px;
      font-size: 11px;
      border-radius: 6px;
    }
    button.remove:hover { background: #e64553; }
    .current-link {
      font-size: 10px;
      color: #a6adc8;
      word-break: break-all;
      background: #313244;
      padding: 5px 7px;
      border-radius: 4px;
      border: 1px solid #45475a;
    }
    .empty {
      text-align: center;
      padding: 20px;
      color: #6c7086;
      font-size: 13px;
    }
    .divider {
      height: 1px;
      background: #45475a;
      margin: 2px 0;
    }
  </style>
</head>
<body>

  <div class="hint">
    <b>💡 Como vincular:</b> Para cada token, você pode vincular uma <b>imagem normal</b> (📷) e uma <b>imagem UV</b> (🔦).<br><br>
    <b>🎯 Para ver:</b> Clique uma vez no token, clique fora, e clique novamente para abrir. No modal, use o botão 🔦 para simular luz UV.
  </div>

  <h3>Tokens na Cena</h3>
  <div id="token-list" class="token-list">Carregando...</div>

  <script type="module">
    import OBR from 'https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm';

    const KEY_NORMAL = 'com.example.image-link/imageUrl';
    const KEY_UV = 'com.example.image-link/uvImageUrl';

    function detectLinkType(raw) {
      if (!raw) return null;
      const t = raw.trim();
      if (/drive\.google\.com|docs\.google\.com/.test(t)) return 'Google Drive';
      if (/imgur\.com/.test(t)) return 'Imgur';
      if (/^https?:\/\//.test(t)) return 'URL direta';
      if (/^[a-zA-Z0-9_-]{25,}$/.test(t)) return 'Google Drive (ID)';
      return null;
    }

    async function init() {
      if (!OBR.isAvailable) return;

      const tokenList = document.getElementById('token-list');

      // Cria o bloco de UI de um slot (Normal ou UV) para um token
      function buildSlot(token, kind, availableImages) {
        const isUV = kind === 'uv';
        const metadataKey = isUV ? KEY_UV : KEY_NORMAL;
        const current = token.metadata[metadataKey];

        const slot = document.createElement('div');
        slot.className = 'slot ' + (isUV ? 'uv' : 'normal');

        const label = document.createElement('div');
        label.className = 'slot-label';
        label.innerHTML = isUV ? '🔦 Imagem UV' : '📷 Imagem Normal';

        const status = document.createElement('span');
        status.style.fontSize = '10px';
        status.textContent = current ? '✅ vinculado' : '—';
        status.style.color = current ? '#a6e3a1' : '#6c7086';
        label.appendChild(status);
        slot.appendChild(label);

        if (current) {
          const info = document.createElement('div');
          info.className = 'current-link';
          info.textContent = current.length > 55 ? current.slice(0, 55) + '...' : current;
          slot.appendChild(info);

          const actions = document.createElement('div');
          actions.className = 'slot-actions';
          actions.style.justifyContent = 'flex-end';

          const removeBtn = document.createElement('button');
          removeBtn.className = 'remove';
          removeBtn.textContent = '🗑️ Remover';
          removeBtn.onclick = async () => {
            await OBR.scene.items.updateItems([token.id], (items) => {
              for (const item of items) delete item.metadata[metadataKey];
            });
            await render();
          };
          actions.appendChild(removeBtn);
          slot.appendChild(actions);
        } else {
          // Dropdown de imagens da cena
          if (availableImages.length > 0) {
            const select = document.createElement('select');
            select.innerHTML = '<option value="">-- Imagem da cena --</option>';
            for (const img of availableImages) {
              const opt = document.createElement('option');
              opt.value = img.image.url;
              opt.textContent = img.name || `Img ${img.id.slice(0, 5)}`;
              select.appendChild(opt);
            }

            const linkSceneBtn = document.createElement('button');
            linkSceneBtn.className = 'link' + (isUV ? ' uv' : '');
            linkSceneBtn.textContent = '🔗 Da cena';
            linkSceneBtn.onclick = async () => {
              const url = select.value;
              if (!url) { alert('Escolha uma imagem primeiro!'); return; }
              await OBR.scene.items.updateItems([token.id], (items) => {
                for (const item of items) item.metadata[metadataKey] = url;
              });
              await render();
            };

            const row1 = document.createElement('div');
            row1.className = 'slot-actions';
            row1.appendChild(select);
            row1.appendChild(linkSceneBtn);
            slot.appendChild(row1);
          }

          // Input para link externo
          const linkInput = document.createElement('input');
          linkInput.type = 'text';
          linkInput.placeholder = 'Cole um link (Drive, Imgur, URL)...';

          const pasteBtn = document.createElement('button');
          pasteBtn.className = 'link' + (isUV ? ' uv' : '');
          pasteBtn.textContent = '🌐 Link';
          pasteBtn.onclick = async () => {
            const raw = linkInput.value.trim();
            if (!raw) { alert('Cole um link primeiro!'); return; }
            if (!detectLinkType(raw)) {
              alert('Link inválido. Use Drive, Imgur ou URL direta.');
              return;
            }
            await OBR.scene.items.updateItems([token.id], (items) => {
              for (const item of items) item.metadata[metadataKey] = raw;
            });
            await render();
          };

          const row2 = document.createElement('div');
          row2.className = 'slot-actions';
          row2.appendChild(linkInput);
          row2.appendChild(pasteBtn);
          slot.appendChild(row2);
        }

        return slot;
      }

      async function render() {
        const items = await OBR.scene.items.getItems();
        const tokens = items.filter(item => item.layer === 'CHARACTER');
        const availableImages = items.filter(item =>
          item.image && item.layer !== 'CHARACTER'
        );

        tokenList.innerHTML = '';

        if (tokens.length === 0) {
          tokenList.innerHTML = '<div class="empty">Nenhum token na cena.<br>Adicione tokens na camada "Characters".</div>';
          return;
        }

        for (const token of tokens) {
          const hasNormal = !!token.metadata[KEY_NORMAL];
          const hasUV = !!token.metadata[KEY_UV];

          const card = document.createElement('div');
          card.className = 'token-item';

          const header = document.createElement('div');
          header.className = 'token-header';

          const nameSpan = document.createElement('span');
          nameSpan.className = 'token-name';
          nameSpan.textContent = token.name || 'Token sem nome';

          const badges = document.createElement('span');
          badges.className = 'badges';
          badges.innerHTML =
            `<span style="color:${hasNormal ? '#a6e3a1' : '#6c7086'}">📷</span> ` +
            `<span style="color:${hasUV ? '#c4a7ff' : '#6c7086'}">🔦</span>`;

          header.appendChild(nameSpan);
          header.appendChild(badges);
          card.appendChild(header);

          card.appendChild(buildSlot(token, 'normal', availableImages));

          const divider = document.createElement('div');
          divider.className = 'divider';
          card.appendChild(divider);

          card.appendChild(buildSlot(token, 'uv', availableImages));

          tokenList.appendChild(card);
        }
      }

      OBR.scene.items.onChange(() => render());
      OBR.scene.onReadyChange(async (ready) => { if (ready) await render(); });
      await render();
    }

    OBR.onReady(init);
  </script>
</body>
</html>
