<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Move Background</title>
</head>
<body>
  <script type="module">
    import OBR from 'https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3.1.0/+esm';

    const MOVE_CHANNEL = 'com.example.move-token/start';
    const TOOL_ID = 'com.example.move-token/draw-path';

    // ═══════════ EASING ═══════════
    const EASING_FNS = {
      linear: (t) => t,
      easeInQuad: (t) => t * t,
      easeOutQuad: (t) => 1 - (1 - t) * (1 - t),
      easeInOutQuad: (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2
    };

    // ═══════════ ANIMAÇÃO COM INTERACTION API ═══════════
    async function animateToken(tokenId, waypoints, duration, easingName) {
      if (!waypoints || waypoints.length === 0) return;

      const items = await OBR.scene.items.getItems([tokenId]);
      if (items.length === 0) return;

      const startPos = items[0].position;
      const path = [{ x: startPos.x, y: startPos.y }, ...waypoints];

      // Comprimentos dos segmentos
      const segLengths = [];
      let totalLength = 0;
      for (let i = 1; i < path.length; i++) {
        const len = Math.hypot(path[i].x - path[i - 1].x, path[i].y - path[i - 1].y);
        segLengths.push(len);
        totalLength += len;
      }
      if (totalLength === 0) return;

      const easeFn = EASING_FNS[easingName] || EASING_FNS.easeInOutQuad;
      const startTime = performance.now();

      // Função para calcular a posição em um progresso (0 a 1)
      function positionAt(progress) {
        const target = progress * totalLength;
        let acc = 0;
        for (let i = 0; i < segLengths.length; i++) {
          if (acc + segLengths[i] >= target) {
            const local = segLengths[i] === 0 ? 0 : (target - acc) / segLengths[i];
            const p1 = path[i], p2 = path[i + 1];
            return {
              x: p1.x + (p2.x - p1.x) * local,
              y: p1.y + (p2.y - p1.y) * local
            };
          }
          acc += segLengths[i];
        }
        return path[path.length - 1];
      }

      // Inicia a interação com o item alvo
      const [updateInteraction, stopInteraction] = await OBR.interaction.startItemInteraction(items[0]);

      return new Promise((resolve) => {
        function frame() {
          const t = Math.min(1, (performance.now() - startTime) / duration);
          const eased = easeFn(t);
          const pos = positionAt(eased);

          // Aplica a atualização através da interação
          updateInteraction((draft) => {
            draft.position.x = pos.x;
            draft.position.y = pos.y;
          });

          if (t < 1) {
            requestAnimationFrame(frame);
          } else {
            // Garante a posição final exata
            const end = path[path.length - 1];
            updateInteraction((draft) => {
              draft.position.x = end.x;
              draft.position.y = end.y;
            });
            stopInteraction();
            resolve();
          }
        }
        requestAnimationFrame(frame);
      });
    }

    // ═══════════ VISUAL DO CAMINHO (temporário) ═══════════
    let pathItems = [];

    async function clearPathVisual() {
      if (pathItems.length === 0) return;
      const ids = pathItems.map(i => i.id);
      pathItems = [];
      try { await OBR.scene.items.deleteItems(ids); } catch (e) {}
    }

    async function updatePathVisual(waypoints) {
      await clearPathVisual();
      if (waypoints.length === 0) return;

      const items = waypoints.map((wp, i) => ({
        id: crypto.randomUUID(),
        type: 'SHAPE',
        name: `Ponto ${i + 1}`,
        visible: true,
        locked: true,
        layer: 'DRAWING',
        zIndex: 9999,
        position: { x: wp.x, y: wp.y },
        rotation: 0,
        scale: { x: 1, y: 1 },
        metadata: { 'com.example.move-token/temp': true },
        style: {
          fillColor: '#f9e2af',
          fillOpacity: 0.9,
          strokeColor: '#1e1e2e',
          strokeOpacity: 1,
          strokeWidth: 2,
          strokeDash: []
        },
        shapeType: 'ellipse',
        width: 14,
        height: 14
      }));

      try {
        await OBR.scene.items.addItems(items);
        pathItems = items;
      } catch (e) {
        console.error('Erro ao desenhar caminho:', e);
      }
    }

    // ═══════════ TOOL MODE ═══════════
    let currentPath = [];
    let isDrawing = false;

    OBR.onReady(async () => {
      if (!OBR.isAvailable) return;

      try {
        await OBR.tool.createMode({
          id: TOOL_ID,
          icons: [{
            icon: '/mover-token/draw-icon.svg',
            label: 'Desenhar Caminho',
            filter: { activeTools: [], permissions: [], roles: ['GM', 'PLAYER'] }
          }],
          shortcut: 'P',
          defaultMetadata: {},
          onToolDragStart: (context, event) => {
            if (context.activeMode !== TOOL_ID) return;
            currentPath = [{ x: event.pointerPosition.x, y: event.pointerPosition.y }];
            isDrawing = true;
            updatePathVisual(currentPath);
          },
          onToolDragMove: (context, event) => {
            if (context.activeMode !== TOOL_ID || !isDrawing) return;
            const last = currentPath[currentPath.length - 1];
            const dx = event.pointerPosition.x - last.x;
            const dy = event.pointerPosition.y - last.y;
            if (Math.hypot(dx, dy) > 30) {
              currentPath.push({ x: event.pointerPosition.x, y: event.pointerPosition.y });
              updatePathVisual(currentPath);
            }
          },
          onToolDragEnd: async (context, event) => {
            if (context.activeMode !== TOOL_ID || !isDrawing) return;
            isDrawing = false;

            currentPath.push({ x: event.pointerPosition.x, y: event.pointerPosition.y });

            if (currentPath.length < 2) {
              await clearPathVisual();
              currentPath = [];
              return;
            }

            const selection = await OBR.player.getSelection();
            if (!selection || selection.length !== 1) {
              alert('Selecione um único token antes de desenhar o caminho!');
              await clearPathVisual();
              currentPath = [];
              return;
            }

            const tokenId = selection[0];
            const duration = 3000;
            const easing = 'easeInOutQuad';

            await animateToken(tokenId, currentPath, duration, easing);

            setTimeout(async () => {
              await clearPathVisual();
              currentPath = [];
            }, 500);
          }
        });
      } catch (e) {
        console.error('Erro ao criar tool mode:', e);
      }

      OBR.broadcast.onMessage(MOVE_CHANNEL, async (event) => {
        const { tokenId, endX, endY, duration, easing } = event.data || {};
        if (!tokenId) return;
        await animateToken(tokenId, [{ x: endX, y: endY }], duration, easing);
      });
    });
  </script>
</body>
</html>
